name: finance-vibe

services:
  finance-vibe:
    container_name: finance_vibe

    build:
      context: .

    ports:
      - "5000:5000"

    volumes:
      - /mnt/fast/finance-vibe-data:/app/data
      # Live docs tree for the in-UI handbook (image also copies docs/ at build)
      - ./docs:/app/docs:ro

    restart: unless-stopped
    
    environment:
      TZ: America/New_York
      FLASK_DEBUG: "0"
