{% extends "base.html" %}
{% block title %}Coiled Cobra - {{ date }} ({{ mode }}){% endblock %}
{% block content %}
    <a class="back" href="{{ url_for('runs') }}">← Back to runs</a>
    <div class="page-head">
        <h1>🐍 Coiled Cobra Setups <span class="tip" title="Never backtested: Score and Grade are untested. Highest Score first.">?</span></h1>
        <span class="asof-badge">{{ mode }} run {{ date }}</span>
    </div>
    <div class="meta"><span class="label">Source file</span> <code>{{ file_name }}</code> · <span class="label">Showing</span> <strong>{{ row_count }}</strong> setup(s)</div>

    <div class="table-container">
        {{ table_html|safe }}
    </div>
{% endblock %}
