# pre-commit install   (once per clone; needs `pip install pre-commit` or `uv tool install pre-commit`)
# mypy is deliberately not here: with pandas-stubs it is too slow for every
# commit. Run scripts/lint_in_container.sh instead.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0  # keep in step with the `lint` group in pyproject.toml
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
