[project]
name = "finance-vibe"
version = "0.1.0"
description = "Coil -> expansion stock signals: ticker universe, Yahoo OHLCV ingest, Coiled Cobra scoring, informational trade plans."
readme = "README.md"
requires-python = ">=3.12,<3.14"  # numpy 2.2.6 (baseline) has no 3.14 wheels
# Lower bounds come from constraints/2026-10-baseline.txt (Phase 0 freeze);
# exact versions live in uv.lock.
dependencies = [
    "pandas>=3.0.5,<4",
    "numpy>=2.2.6,<3",
    "pandas-ta==0.4.71b0", # beta; any change can move Score (MODERNIZATION_PLAN Phase 4.4)
    "yfinance>=1.7.0,<2",
    "yahooquery>=2.4.1,<3",
    "flask>=3.1.3,<4",
    "markdown>=3.10.3,<4",
    "pygments>=2.21.0,<3",
    "tabulate>=0.10.0",
]

[project.scripts]
finance-vibe = "finance_vibe.run_vibe:run_workflow"
finance-vibe-app = "finance_vibe.app:main"

[dependency-groups]
# ML lab + gated ranking paths (ML_RANKING_ENABLED = False).
ml = [
    "xgboost>=3.4.1,<4",
    "lightgbm>=4.7.0,<5",
    "scikit-learn>=1.9.1,<2",
    "matplotlib>=3.11.2,<4",
]
dev = [
    "pytest>=9.1.1",
]
# Not a default group, so the production image doesn't install it. Run it via
# scripts/lint_in_container.sh. ruff is pinned exactly because the formatter's
# output changes between releases.
lint = [
    "ruff==0.17.0",
    "mypy>=2.4.0,<3",
    "pandas-stubs>=3.0.5.260914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_vibe"]

[tool.uv]
# Tests import the ML modules, so a plain `uv sync` installs both groups.
default-groups = ["dev", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# notebooks: exploration only. docs: hand-written prose; leave its code blocks alone.
extend-exclude = ["notebooks", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PD", "RUF"]
ignore = [
    "E501",    # ruff format owns line length; long strings/docstrings stay as written
    "RUF001", "RUF002", "RUF003",  # intentional unicode (arrows, x, dashes) in text
    "RUF046",  # int(round(np.float64)) is not a redundant cast: numpy returns float
    "PD008",   # .at is the fast scalar accessor; keep it
    "SIM103", "SIM108",  # explicit early returns / if-else read better in the gates
    "RUF005",  # list concatenation is fine
    "SIM300",  # `x == pytest.approx(...)` / `A <= cols` read better as written
]

[tool.ruff.lint.isort]
known-first-party = ["finance_vibe"]

[tool.mypy]
python_version = "3.12"
files = ["src/finance_vibe"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Untyped third-party packages.
module = [
    "yfinance.*", "yahooquery.*", "pandas_ta.*",
    "xgboost.*", "lightgbm.*", "sklearn.*", "markdown.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Scoring and data-contract core: strict. Widen one module per PR
# (MODERNIZATION_PLAN Phase 2). mypy's `strict` is global-only, so this lists
# the flags it would turn on.
module = [
    "finance_vibe.config",
    "finance_vibe.analysis_engine",
    "finance_vibe.coiled_cobra",
    "finance_vibe.trade_planner",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
